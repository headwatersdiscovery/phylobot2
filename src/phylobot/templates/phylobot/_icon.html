{# A small line icon: include with name="download" | "run-again" | "pencil" | "lock" | "trash" | "copy" | "play" | "stop" | "edit" | "edit-copy" | "extend" | "view" | "check" | "alignment" | "route" | "pin" | "stack" | "side". #}
<svg width="{{ size|default:18 }}" height="{{ size|default:18 }}" viewBox="0 0 24 24" aria-hidden="true" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  {% if name == "download" %}<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
  {% elif name == "structure" %}<path d="M12 3 4 7v10l8 4 8-4V7Z"/><path d="m4 7 8 4 8-4"/><path d="M12 11v10"/>
  {% elif name == "route" %}<circle cx="5" cy="5" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M7.2 5H12v14h4.8"/>
  {% elif name == "pin" %}<path d="M9 4h6l-1 6 3 3H7l3-3-1-6Z"/><path d="M12 13v7"/>
  {% elif name == "stack" %}<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/>
  {% elif name == "side" %}<rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/>
  {% elif name == "upload" %}<path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/>
  {% elif name == "run-again" %}<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/>
  {% elif name == "pencil" %}<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
  {% elif name == "lock" %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
  {% elif name == "trash" %}<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 1H8a2 2 0 0 1-2-1L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
  {% elif name == "copy" %}<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
  {% elif name == "edit" %}<path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a1.4 1.4 0 0 1 2 2l-8.6 8.6-2.8.8.8-2.8Z"/>
  {% elif name == "edit-copy" %}<path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/><path d="M14 9h-3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3"/><path d="M19.6 6.4a1.4 1.4 0 0 1 2 2l-6 6-2.6.6.6-2.6Z"/>
  {% elif name == "play" %}<path d="M7 4v16l13-8Z"/>
  {% comment %}Filled, unlike its outline siblings: a solid square is the stop glyph
    people know, and an outlined one reads as an empty checkbox at this size.{% endcomment %}
  {% elif name == "stop" %}<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
  {% elif name == "view" %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>
  {% elif name == "extend" %}<path d="M4 5v14"/><path d="M8 12h12"/><path d="m15 7 5 5-5 5"/>
  {% elif name == "check" %}<path d="m5 12.5 4.5 4.5L19 7.5"/>
  {% comment %}Four rows of dashes, gaps in different places: sequences in an alignment.{% endcomment %}
  {% elif name == "alignment" %}<path d="M3 5h7M13 5h2M18 5h3"/><path d="M3 10h3M9 10h8M20 10h1"/><path d="M3 15h10M16 15h5"/><path d="M3 20h4M10 20h3M16 20h5"/>{% endif %}
</svg>
