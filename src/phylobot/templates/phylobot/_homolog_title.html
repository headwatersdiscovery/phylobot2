{# A search's title with a pencil to rename it in place (homolog_views.rename_homolog_search): #}
{# the pencil shows the form (rename.js); saving swaps this part back, done editing. #}
<div class="editable-title" id="search-title">
  <div class="title-view">
    <h1>{{ homolog_search.name|default:"Search" }}</h1>
    <button type="button" class="icon-button" data-rename aria-label="Rename this search" title="Rename">
      {% include "phylobot/_icon.html" with name="pencil" %}
    </button>
  </div>
  <form class="title-edit" hidden method="post" action="{% url 'rename_homolog_search' homolog_search.id %}"
        hx-post="{% url 'rename_homolog_search' homolog_search.id %}" hx-target="#search-title" hx-swap="outerHTML">
    {% csrf_token %}
    <input name="name" value="{{ homolog_search.name }}" maxlength="100" placeholder="Search"
           aria-label="Search name" autocomplete="off">
    <button type="submit" class="primary">Save</button>
    <button type="button" class="link" data-rename-cancel>Cancel</button>
  </form>
</div>
