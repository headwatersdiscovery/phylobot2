# Golden scenario: lysin/codon-indels
#
# Like codon-easy (same tree, root and GY+F3X4+G4 model) plus insertions and deletions
# in whole codons, so the true ancestors have codon gaps: tests codon alignment and gap
# placement on codon columns. The site-class (M3) model of codon-selection
# can't be combined with indels, since its classes are simulated in separate runs.
# Indel rate 0.03 with geometric lengths of mean 2 codons gives an alignment ~30% gaps.

description = "Abalone sperm lysin (25 species, 134 codons); GY+F3X4+G4 with codon indels (rate 0.03, mean length 2 codons)."

[tree]
file = "../source/gy_g4.nwk"
midpoint = true

[root]
file = "../root.fasta"
name = "Haliotis_rufescens_lysin"

[model]
seqtype = "CODON1"
substitution = "GY{1.0172,1.6247}+F3X4{0.34149/0.22514/0.26352/0.16984/0.30553/0.16440/0.22393/0.30613/0.21154/0.24902/0.25960/0.27984}+G4{1.0997}"

[indels]
rates = "0.03,0.03"
sizes = "GEO{2},GEO{2}"

[simulation]
image = "quay.io/biocontainers/iqtree:3.1.3--h8471819_0"
seeds = [312, 313, 314, 315, 316, 317, 318, 319, 320, 321]  # first = quick tier
