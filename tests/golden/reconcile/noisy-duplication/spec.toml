# Golden scenario: reconcile/noisy-duplication, the pass/fail test of
# reconciliation (signed off by the owner 2026-10-18; thresholds in expected_metrics.json,
# run by tests/golden/test_reconcile.py). Counterpart to hidden-paralogy: the same 20 species and the same duplication just above the root, but no losses, so
# every species keeps both copies (40 genes) and the duplication is plain to see. The
# sequences are short (100 sites), so the sequence-only tree is noisy within each copy:
# the case where the species tree should correct the gene tree rather than mislead it.
#
# Redesigned 2026-10-26 (owner): the duplication sits halfway up a 0.2 stem, so each
# copy's stem is 0.1. It was 0.08 down a 0.1 stem, leaving stems of 0.02: the copies'
# founders differed at 1-4 of 100 sites, so which A+B group pairs with which C+D group
# was a near coin toss that no species tree can settle (both pairings cost one
# duplication and no losses), and replicate 409 lost it.

description = "Visible duplication above the root of 20 species, every copy kept, 100 sites; LG+G4."

[tree]
file = "../species.nwk"

[root]
length = 100

[model]
substitution = "LG+G4{0.75}"

[family]
duplication = 0
loss = 0
origin = 0.2
duplications = [{ clade = ["A1", "A2", "A3", "A4", "A5", "B1", "B2", "B3", "B4", "B5", "C1", "C2", "C3", "C4", "C5", "D1", "D2", "D3", "D4", "D5"], at = 0.5 }]

[simulation]
image = "quay.io/biocontainers/iqtree:3.1.3--h8471819_0"
seeds = [401, 402, 403, 404, 405, 406, 407, 408, 409, 410]  # first = quick tier
