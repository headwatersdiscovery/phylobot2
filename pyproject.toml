[project]
name = "phylobot"
version = "0.1.0"
description = "Automated ancestral sequence reconstruction and mutational-trajectory exploration."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Victor Hanson-Smith", email = "hello@phylobot.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "dendropy>=5.1.0",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
    "types-openpyxl>=3.1.5.20260827",
]
ml = [
    "fair-esm==2.0.0",
    "metapredict==3.0.2",
    "torch==2.9.1",
]
web = [
    "boto3>=1.43.103",
    "django>=6.1.1",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[tool.uv]
# `web` holds the Django stack; the pipeline tools image installs neither group.
# `ml` holds the neural property predictors; only the phylobot-ml
# image installs it, so neither the editor's .venv nor the tools image carries torch.
default-groups = ["dev", "web"]

# torch from PyTorch's CPU-only index: the PyPI wheels for Linux pull several GB of CUDA
# libraries, and Docker Desktop on macOS has no GPU to use them.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
phylobot-validate = "phylobot.pipeline.validate:main"
phylobot-export = "phylobot.pipeline.export:main"
phylobot-summary = "phylobot.pipeline.summary:main"
phylobot-ancestor-map = "phylobot.pipeline.ancestor_map:main"
phylobot-root = "phylobot.rooting:main"
phylobot-export-alignment = "phylobot.pipeline.export:main_alignment"
phylobot-export-tree = "phylobot.pipeline.export:main_tree"
phylobot-codon-alignment = "phylobot.pipeline.codon_alignment:main"
phylobot-codeml-export = "phylobot.pipeline.codeml_export:main"
phylobot-branch-site-export = "phylobot.pipeline.branch_site_export:main"
phylobot-simulate = "phylobot.simulate.cli:main"
phylobot-species = "phylobot.species.cli:main"
phylobot-species-tree = "phylobot.pipeline.species_tree:main"
phylobot-reconcile-export = "phylobot.pipeline.reconcile_export:main"
phylobot-properties = "phylobot.pipeline.properties:main"
phylobot-uncertainty = "phylobot.pipeline.uncertainty:main"
phylobot-esr = "phylobot.pipeline.esr:main"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "phylobot.settings"
testpaths = ["tests"]
markers = [
    "golden: runs the real pipeline on golden datasets (slow; needs Docker)",
    "golden_full: extra replicates and their averages (make golden-full)",
    "e2e: drives the running web stack over HTTP (needs `make up`; use `make e2e`)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["src/phylobot/migrations"]  # generated by Django

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The family build scripts are accession tables: one row per sequence, each with its
# provenance note. Wrapping those rows would make them harder to read, not easier.
"tests/benchmark/families/*/build.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
# The family build scripts are hand-run provenance records (one accession per sequence,
# re-checkable with `--check`), not library code, and nothing imports them. Ruff still
# checks them; strict typing on them buys nothing.
exclude = ["^tests/benchmark/families/[^/]+/build\\.py$"]

[[tool.mypy.overrides]]
# DendroPy, boto3 and pyarrow ship no type information; fair-esm and metapredict neither,
# and torch (with them) is only installed by the `ml` group, which the editor's .venv lacks.
module = [
    "dendropy", "dendropy.*", "boto3", "boto3.*", "botocore", "botocore.*",
    "esm", "esm.*", "metapredict", "metapredict.*", "torch", "torch.*",
    "pyarrow", "pyarrow.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "phylobot.settings"
